function taskTree(tasks,parent="",level=0){
const siblings=tasks.filter(t=>(t.parent||"")===parent).sort((a,b)=>a.order-b.order);
return siblings.map((t,i)=>`<div class="task-branch" style="--depth:${Math.min(level,4)}"><div class="task-line"><span class="task-dot ${t.status==="done"?"done":""}">${t.status==="done"?"✓":level+1}</span><div class="grow">${button(esc(t.name),"task",t.id,"","text-button")}<p>${esc(who(t.owner))} · ${esc(t.roleName)} · ${esc(t.end)} ${tasks.some(c=>c.parent===t.id)?"· 进度由下级行动汇总":""}</p></div>${badge(t.priority)}${badge(state(t))}<b>${t.progress}%</b>${user.role==="ceo"?button("↑","move",t.id,`data-kind="tasks" data-direction="-1" ${i===0?"disabled":""} aria-label="上移同级任务"`)+button("↓","move",t.id,`data-kind="tasks" data-direction="1" ${i===siblings.length-1?"disabled":""} aria-label="下移同级任务"`):""}${user.role==="ceo"&&t.status==="active"?button("＋ 子任务","add-child",t.id):""}</div>${taskTree(tasks,t.id,level+1)}</div>`).join("");
}
function assertFresh(){
if(storageLocked)return;
let raw;try{raw=localStorage.getItem(KEY)}catch{return}
if(raw!==storageSnapshot){if(raw){const parsed=JSON.parse(raw);C.validate(parsed.data);data=C.upgrade(parsed.data);storageSnapshot=raw;render()}throw Error("另一窗口已更新数据，请关闭此表单后重新打开，避免覆盖新内容。")}
}
function adoptStorage(raw){
if(!raw||raw===storageSnapshot)return;
if($("modal").open){$("formError").textContent="另一窗口有更新，请关闭并重新打开表单。";return}
try{const parsed=JSON.parse(raw);C.validate(parsed.data);data=C.upgrade(parsed.data);storageSnapshot=raw;if(C.dateOK(parsed.asOf))asOf=parsed.asOf;render()}catch{notify("另一窗口的数据无法读取，当前内容已保留")}
}

function oaMine(k,r){return k==='requests'?r.status==='pending'&&r.approvers[r.step]===user.person:k==='collabs'?((['pending','accepted'].includes(r.status)&&r.owner===user.person)||(r.status==='review'&&r.author===user.person)):k==='reports'?r.status==='submitted'&&r.reviewer===user.person:k==='notices'?r.audience.includes(user.person)&&!r.reads.some(x=>x.person===user.person):r.status==='scheduled'&&r.attendees.includes(user.person)}
function oaLink(label,k,id='',cls=''){return button(label,'oa-open',id,`data-kind="${k}"`,cls)}
function oaPending(){return oaRows('requests').filter(r=>r.status==='pending').length}
function oaExecutive(){
const late=['requests','collabs'].flatMap(k=>oaRows(k).filter(r=>oaOpen(k,r)&&r.due<asOf).map(r=>({k,r}))),meetings=oaRows('meetings').filter(r=>r.status==='scheduled'&&r.due>=asOf).sort((a,b)=>a.due.localeCompare(b.due));
const actionable=['requests','reports','collabs','notices'].reduce((n,k)=>n+oaRows(k).filter(r=>oaMine(k,r)).length,0);
return `<section class="panel oa-executive"><div class="section-title"><div><div class="eyebrow">OFFICE MANAGEMENT</div><h2>协作与审批</h2></div>${view==='oa'?'':button('进入办公中心 ↗','module','oa','','primary')}</div><div class="oa-metrics"><div><strong>${actionable}</strong><span>待我处理</span></div><div><strong>${oaPending()}</strong><span>流转中申请</span></div><div><strong class="${late.length?'red-text':''}">${late.length}</strong><span>逾期申请 / 协作</span></div><div><strong>${meetings.length}</strong><span>待开会议</span></div></div><div class="oa-executive-bottom"><p>${meetings[0]?'下一场：'+esc(meetings[0].due+' '+meetings[0].time+' · '+meetings[0].title):'暂无待开会议'} ${meetings[0]?oaLink('查看','meetings',meetings[0].id,'link'):''}</p><p class="muted">${late.length?'逾期：'+late.slice(0,2).map(x=>esc(x.r.title)).join('；'):'暂无逾期申请或协作'} · 按演示基准日计算</p></div>${user.role==='ceo'?`<details class="oa-workload"><summary>管理层办公待办总览</summary><div class="oa-grid">${data.members.filter(m=>m.level==='manager').map(m=>`<div class="oa-small"><b>${esc(m.name)} · ${esc(m.role)}</b><p>待审批 ${data.oa.requests.filter(r=>r.status==='pending'&&r.approvers[r.step]===m.id).length} · 待点评 ${data.oa.reports.filter(r=>r.status==='submitted'&&r.reviewer===m.id).length} · 待接单 / 推进 ${data.oa.collabs.filter(r=>r.owner===m.id&&['pending','accepted'].includes(r.status)).length}</p></div>`).join('')}</div></details>`:''}</section>`;
}
function oaView(){
return title('OFFICE & COLLABORATION','协作与审批','方案、会议、汇报与评论集中协同。')+`<div class="oa-tabs" role="tablist" aria-label="办公模块">${Object.entries(oaTabs).map(([k,l])=>`<button role="tab" aria-selected="${oaTab===k}" class="${oaTab===k?'primary':''}" data-action="oa-tab" data-id="${k}">${l}${k!=='home'?` <small>${oaRows(k).length}</small>`:''}</button>`).join('')}</div>`+(oaTab==='home'?oaHome():oaList(oaTab));
}
function oaHome(){
const todo=['requests','meetings','reports','collabs','notices'].flatMap(k=>oaRows(k).filter(r=>oaMine(k,r)).map(r=>({k,r}))).sort((a,b)=>a.r.due.localeCompare(b.r.due));
return oaExecutive()+`<div class="oa-quick">${oaLink('＋ 发起申请','requests')}${oaLink('＋ 提交汇报','reports')}${oaLink('＋ 跨部门协作','collabs')}${user.role!=='operator'?oaLink('＋ 安排会议','meetings')+oaLink('＋ 发布公告 / 制度','notices'):''}</div><section class="panel"><div class="section-title"><h2>我的办公清单</h2><span class="muted">${esc(who(user.person))} · ${todo.length} 项</span></div>${todo.map(({k,r})=>`<div class="oa-todo"><div><b>${esc(r.title)}</b><p class="muted">${oaTabs[k]} · ${esc(projectName(r.project))} · ${esc(r.due)} ${r.due<asOf?'<span class="red-text">已逾期</span>':''}</p></div>${oaLink('查看并处理',k,r.id)}</div>`).join('')||empty('当前没有待我处理的办公事项')}</section><p class="muted">新建的办公事项会保留在本机；站内催办不会发送邮件或消息。身份切换仅用于演示。</p>`;
}
function oaList(k){const rows=oaRows(k).filter(r=>!oaSearch||(r.title+' '+r.body+' '+projectName(r.project)+' '+who(r.author)).toLowerCase().includes(oaSearch.toLowerCase()));
return `<div class="toolbar"><input id="oaSearch" aria-label="搜索办公事项" placeholder="搜索标题、内容、项目或发起人" value="${esc(oaSearch)}"><span class="muted">${rows.length} 条 · 本人参与范围${user.role==='ceo'?' / CEO 全部可见':''}</span>${!['meetings','notices'].includes(k)||user.role!=='operator'?oaLink('＋ '+({requests:'发起申请',meetings:'安排会议',reports:'提交汇报',collabs:'发起协作',notices:'发布公告 / 制度'}[k]),k,'','primary'):''}</div><div class="oa-grid">${rows.map(r=>oaCard(k,r)).join('')||empty('暂无符合条件的记录')}</div>`;
}
function oaCard(k,r){const late=oaOpen(k,r)&&r.due<asOf;
const detail=k==='requests'?`审批流：${r.approvers.map((id,i)=>esc(who(id))+(r.status==='pending'&&i===r.step?'（当前）':'')).join(' → ')} · ${money(r.amount,r.currency)}`:k==='meetings'?`${esc(r.due+' '+r.time)} · ${r.attendees.length} 人 · ${r.tasks.length} 项行动`:k==='reports'?`${esc(r.period)} · 点评人 ${esc(who(r.reviewer))}`:k==='collabs'?`接收人 ${esc(who(r.owner))}`:`${esc(r.category)} v${r.version} · ${r.reads.length}/${r.audience.length} 已读`;
return `<article class="panel oa-card"><div class="row spread">${badge(oaStatus[r.status],late?'amber':'')}${badge(projectName(r.project),'blue')}</div><h2>${esc(r.title)}</h2><p class="oa-excerpt">${esc(r.body)}</p><p class="muted">${detail}</p><p class="muted">${esc(who(r.author))} · ${k==='notices'?'阅读确认期限':'日期 / 截止'} ${esc(r.due)} ${late?'<span class="red-text">逾期</span>':''}</p><div class="actions">${oaLink(oaMine(k,r)?'查看并处理':'查看详情',k,r.id,oaMine(k,r)?'primary':'')}</div></article>`;
}
function oaApprovals(){return `<section class="panel"><div class="section-title"><h2>OA 办公申请</h2>${oaLink('＋ 发起申请','requests')}</div><p class="muted">依次由指定审批人处理；CEO 不跳过当前审批节点。通过申请不代表已付款或已完成项目任务。</p><div class="oa-grid">${oaRows('requests').map(r=>oaCard('requests',r)).join('')||empty('暂无办公申请')}</div></section>`}
function oaRisks(){const rows=['requests','collabs'].flatMap(k=>oaRows(k).filter(r=>oaOpen(k,r)&&r.due<asOf).map(r=>({k,r})));return `<section class="panel"><div class="section-title"><h2>OA 逾期事项</h2><span class="muted">${rows.length} 项</span></div><div class="oa-grid">${rows.map(({k,r})=>oaCard(k,r)).join('')||empty('暂无逾期办公申请或跨部门协作')}</div></section>`}
function oaMulti(label,name,arr,values){return `<label class="full">${label}<select name="${name}" multiple size="5" required>${arr.map(m=>`<option value="${esc(m.id)}" ${values.includes(m.id)?'selected':''}>${esc(m.name+' · '+(m.role||''))}</option>`).join('')}</select><small class="muted">按住 Ctrl / Command 多选</small></label>`}
function oaEdit(k,id){const r=id?data.oa[k].find(x=>x.id===id):{},projects=data.projects.filter(p=>C.oaCanProject(data,user,p.id));if(!projects.length)return notify('当前成员未关联项目，请在人力资源中维护项目范围');const managers=data.members.filter(m=>m.level!=='operator'&&m.id!==user.person),members=data.members;
let body=field('标题','title',r.title)+select('关联项目','project',projects,r.project||projects[0].id)+field(k==='meetings'?'会议日期':k==='reports'?'报告截至日期':k==='notices'?'阅读确认期限':'截止日期','due',r.due||asOf,'date')+area(k==='meetings'?'议题 / 会前资料':k==='reports'?'本期成果与依据':'内容 / 背景与要求','body',r.body);
if(k==='requests')body+=select('申请类别','category',['通用','资源','采购','费用'].map(id=>({id,name:id})),r.category||'通用')+numberField('申请金额（无金额填 0）','amount',r.amount||0,0,0.01)+select('币种','currency',[{id:'USD',name:'美元 USD'},{id:'CNY',name:'人民币 CNY'}],r.currency||'USD')+select('第一审批人','first',managers,r.approvers?.[0]||managers.find(m=>m.id===data.members.find(x=>x.id===user.person)?.reportsTo)?.id||managers[0]?.id)+select('第二审批人（可选）','second',[{id:'',name:'不设置第二级'},...managers],r.approvers?.[1]||'');
if(k==='meetings')body+=field('会议时间','time',r.time||'10:00','time')+oaMulti('参会成员','attendees',members,r.attendees||[user.person]);
if(k==='reports')body+=select('汇报周期','period',['日报','周报','月报'].map(id=>({id,name:id})),'周报')+select('点评负责人','reviewer',members.filter(m=>m.level!=='operator'),members.find(m=>m.id===data.members.find(x=>x.id===user.person)?.reportsTo)?.id||'ceo')+area('当前障碍 / 需要的支持','blockers','',false)+area('下一步计划','next')+'<p class="muted full">提交时自动附上当前身份在该项目可汇报的任务进度与 OKR 快照；后续变化不会改写本期快照。</p>';
if(k==='collabs')body+=select('接收责任人（可跨部门）','owner',members.filter(m=>m.id!==user.person),members.find(m=>m.id!==user.person)?.id);
if(k==='notices')body+=select('类型','category',['公告','制度'].map(id=>({id,name:id})),r.category||'公告')+oaMulti('指定阅读成员','audience',members,r.audience||members.map(m=>m.id));
body+=mockAttachmentField();showModal((id?'修改并重新发布 / 提交':'新建')+' · '+oaTabs[k],`<div class="form-grid">${body}</div>`,fd=>{const values=Object.fromEntries(fd.entries());values.files=mockFiles(fd);if(k==='requests'){values.amount=Number(values.amount);values.approvers=[values.first,values.second].filter(Boolean)}if(k==='meetings')values.attendees=fd.getAll('attendees');if(k==='notices')values.audience=fd.getAll('audience');commit({type:'oa',op:({requests:'request',meetings:'meeting',reports:'report',collabs:'collab',notices:'notice'}[k]),id,values})});
}
function oaLog(log){return log.map(e=>`<div class="update"><b>${esc(who(e.person))}</b><small>${esc(e.time)}</small><p>${esc(e.note)}</p></div>`).join('')||'<p class="muted">暂无记录</p>'}
function oaDetail(k,id){const r=data.oa[k]?.find(r=>r.id===id);if(!r||!C.oaVisible(data,user,k,r))return notify('无法查看此事项');const action=(label,op)=>button(label,'oa-command',id,`data-kind="${k}" data-op="${op}"`),author=r.author===user.person||user.role==='ceo';
let body=`<div class="row">${badge(oaTabs[k],'blue')}${badge(oaStatus[r.status])}</div><p class="muted">${esc(projectName(r.project))} · 发起人 ${esc(who(r.author))} · ${esc(r.created)}</p><div class="criteria oa-pre">${esc(r.body)}</div><p>日期 / 截止：${esc(r.due)}</p>`,actions='';
if(k==='requests'){
body+=`<p>${esc(r.category)}申请 · ${money(r.amount,r.currency)}</p><div class="oa-chain">${r.approvers.map((p,i)=>`<span class="${r.status==='pending'&&i===r.step?'current':''}">${i+1}. ${esc(who(p))}${r.status==='pending'&&i===r.step?' · 待审批':''}</span>`).join('<span>→</span>')}</div><p class="muted">审批通过仅代表授权，实际付款与项目交付仍须分别登记、验收。</p>`;
if(oaMine(k,r))actions+=action('审批并填写意见','decide');if(r.author===user.person&&r.status==='pending')actions+=action('撤回申请','withdraw');if(r.author===user.person&&['rejected','withdrawn'].includes(r.status))actions+=action('修改后重新提交','edit');if(author&&r.status==='pending')actions+=action('站内催办','remind');
}else if(k==='meetings'){
body+=`<h3>会前议题征集</h3>${oaLog(r.agenda||[])}`;
if(r.status==='scheduled'&&(author||r.attendees.includes(user.person)))actions+=action('补充会前议题','agenda');
body+=`<p>时间：${esc(r.time)} · 参会：${r.attendees.map(p=>esc(who(p))).join('、')}</p><h3>会议纪要与决议</h3>${oaLog(r.minutes)}<h3>关联项目行动</h3>${r.tasks.map(id=>{const t=data.tasks.find(t=>t.id===id);return `<p>${button(esc(t.name),'task',id,'','link')} · ${esc(who(t.owner))} · ${t.progress}% · ${state(t)}</p>`}).join('')||'<p class="muted">尚未生成行动</p>'}`;
if(author){actions+=action('补充会议纪要','minutes');if(r.minutes.length)actions+=action('决议转为项目行动','action')}
}else if(k==='reports'){
body+=`<details><summary>提交时 OKR 关键结果快照（${(r.krSnapshot||[]).length} 项）</summary>${(r.krSnapshot||[]).map(m=>`<p>${esc(m.name)} · ${m.rate===null?'未配置量化指标':m.rate+'%'}</p>`).join('')}</details>`;
body+=`<p>${esc(r.period)} · 点评人 ${esc(who(r.reviewer))}</p><h3>障碍与支持</h3><p class="oa-pre">${esc(r.blockers||'无')}</p><h3>下一步计划</h3><p class="oa-pre">${esc(r.next)}</p><details><summary>提交时项目进度快照（${r.snapshot.length} 项）</summary>${r.snapshot.map(t=>`<p>${esc(t.name)} · ${t.progress}%</p>`).join('')}</details><h3>负责人点评</h3>${oaLog(r.comments)}`;if(r.reviewer===user.person||user.role==='ceo')actions+=action('填写点评','comment');
}else if(k==='collabs'){
if(r.escalation){const a=data.oa.requests.find(a=>a.id===r.escalation);body+=`<div class="criteria">已升级 CEO：${badge(oaStatus[a.status])} ${oaLink('查看升级审批','requests',a.id,'link')}</div>`}
if(user.role!=='ceo'&&(r.author===user.person||r.owner===user.person)&&r.status!=='done'&&!data.oa.requests.some(a=>a.id===r.escalation&&a.status==='pending'))actions+=action('升级 CEO 协调','escalate');
body+=`<p>接收责任人：${esc(who(r.owner))}</p><div class="oa-chain">发起 → 接单 → 反馈结果 → 发起人确认</div>`;
if(r.owner===user.person&&r.status==='pending')actions+=action('确认接单','accept');if(r.owner===user.person&&r.status==='accepted')actions+=action('提交协作结果','deliver');if(r.author===user.person&&r.status==='review')actions+=action('确认 / 退回结果','confirm');if(author&&r.status!=='done')actions+=action('站内催办','remind');
}else{
body+=`<p>${esc(r.category)} · 当前 v${r.version} · ${r.reads.length}/${r.audience.length} 已确认</p><p class="muted">阅读范围：${r.audience.map(p=>esc(who(p))).join('、')}</p><p>已确认：${r.reads.map(x=>esc(who(x.person))).join('、')||'暂无'}</p><p class="muted">未确认：${r.audience.filter(p=>!r.reads.some(x=>x.person===p)).map(p=>esc(who(p))).join('、')||'全部确认'}</p>${r.versions.length?`<details><summary>历史版本</summary>${r.versions.map(v=>`<h3>v${v.version} · ${esc(v.title)}</h3><p class="oa-pre">${esc(v.body)}</p>`).join('')}</details>`:''}`;
if(oaMine(k,r))actions+=action('确认已阅读','ack');if(author&&user.role!=='operator')actions+=action('更新版本','edit');
}
body+=`<div class="actions oa-quick">${actions}</div><h3>处理记录</h3>${oaLog(r.events)}${discussionView(k,r)}`;showModal(r.title,body,null);
}
function oaCommand(k,id,op){const r=data.oa[k].find(x=>x.id===id);if(op==='edit')return oaEdit(k,id);if(op==='ack')return commit({type:'oa',op,id,values:{}});
let heading='',body='',operation=op;
if(op==='action'){
heading='将会议决议生成项目行动';const ms=data.milestones.filter(m=>data.stages.some(s=>s.id===m.stage&&s.project===r.project));if(!ms.length)return notify('请先为该项目建立目标与 KR');body=field('行动名称','title')+select('关联关键结果 KR','milestone',ms,ms[0].id)+select('责任人','owner',data.members.filter(m=>m.id!=='ceo'),'chen')+field('截止日期','due',r.due,'date')+area('应交付物','body')+area('验收标准','criteria');
}else{
heading=({agenda:'补充会前议题',escalate:'升级 CEO 协调',decide:'处理办公申请',withdraw:'撤回申请',minutes:'记录会议纪要与决议',comment:'点评工作汇报',accept:'确认接单',deliver:'反馈协作结果',confirm:'确认协作结果',remind:'站内催办'}[op]);
if(op==='decide')body+=select('审批结果','result',[{id:'yes',name:'通过，流转下一步'},{id:'no',name:'退回修改'}],'yes');
if(op==='confirm')body+=select('确认结果','state',[{id:'done',name:'确认完成'},{id:'accepted',name:'退回继续完善'}],'done');
body+=area(op==='minutes'?'会议纪要 / 决议内容':'处理说明 / 证据','note');if(op==='remind')body+='<p class="muted full">记录在本站内，不会发送邮件、短信或外部消息。</p>';
}
showModal(heading,`<p>${esc(r.title)}</p><div class="form-grid">${body}</div>`,fd=>{const values=Object.fromEntries(fd.entries());if(op==='decide')values.approve=values.result==='yes';if(op==='accept'||op==='deliver'||op==='confirm'){operation='collab-state';values.state=op==='accept'?'accepted':op==='deliver'?'review':values.state}if(op==='remind')values.kind=k;commit({type:'oa',op:operation,id,values})});
}

function deleteProjectModal(id){
if(user.role!=='ceo')throw Error('仅 CEO 可删除项目');
if(storageLocked)throw Error('当前本地记录无法读取，请先恢复有效备份再删除');
const plan=C.deletionPlan(data,id);
if(plan.dependents.length){showModal('暂时无法删除项目',`<p>其他项目仍有任务依赖「${esc(plan.project.name)}」，请先调整这些任务的前置依赖。</p>${plan.dependents.map(t=>'<p>'+button(esc(t.name),'task',t.id,'','link')+'</p>').join('')}`,null);return}
let backupSnapshot=null;
showModal('删除项目 · '+plan.project.name,`<p class="red-text"><b>将删除本项目及以下关联记录：</b></p><div class="criteria">${Object.entries(plan.counts).map(([k,n])=>esc(k)+' '+n+' 条').join(' · ')}</div><p>成员档案、其他项目和历史记录会保留。此操作没有撤销按钮；导入删除前的完整备份可恢复，但会替换当时的整个工作台数据。</p><div class="actions"><button type="button" id="deleteBackup">① 下载删除前完整备份</button></div><p id="deleteBackupState" class="muted">请先下载备份，再确认删除。</p><div class="form-grid"><label class="full"><span><input type="checkbox" name="backupConfirm" required style="width:auto"> 我已确认备份文件下载完成</span></label>${field('② 输入完整项目名称：'+plan.project.name,'confirm')}</div>`,fd=>{
assertFresh();
if(!backupSnapshot||backupSnapshot!==JSON.stringify({data,asOf}))throw Error('请先下载当前数据的完整备份；若数据已变化，请重新下载');
if(fd.get('backupConfirm')!=='on')throw Error('请先确认备份文件下载完成');
const previous=data,draft=C.clone(data);C.change(draft,user,{type:'delete-project',id,confirm:fd.get('confirm')});
data=draft;if(!save()){data=previous;render();throw Error('删除未能保存，已保留原数据；请检查浏览器存储后重试')}
selected=businessProjects()[0]?.id||'';moduleProject='';$("modal").close();render();notify('项目及关联记录已删除；删除前备份可用于恢复');
});
$("saveBtn").textContent='确认删除项目';$("deleteBackup").onclick=()=>{try{assertFresh();exportData();backupSnapshot=JSON.stringify({data,asOf});$("deleteBackupState").textContent='已发起备份下载，请确认下载文件后勾选上方确认项。'}catch(err){$("formError").textContent=err.message}};
}

let adminTab='tools';
const adminLabels={tools:'事务工具清单',personnel:'人事事务',assets:'资产与办公资源',access:'职位与权限',collaboration:'协作与审批'};
const adminState={pending:'待审批',approved:'待行政办理',rejected:'已退回',withdrawn:'已撤回',completed:'已办理',available:'可用',issued:'已分配',repair:'维修中'};
const adminPermissionNames={personnel:'人事事务办理',assets:'资产与办公资源管理',access:'人员职位与行政权限分配'};
function adminRows(k){return data.admin[k].filter(r=>C.adminVisible(data,user,k,r))}
function adminLink(label,op,id='',extra='',cls=''){return button(label,'admin',id,`data-op="${op}" ${extra}`,cls)}
function adminPending(){return adminRows('personnel').filter(r=>r.status==='pending').length+adminRows('assetRequests').filter(r=>r.status==='pending').length}
function adminSummary(){const rows=adminRows('personnel'),assets=adminRows('assetRequests');return `<section class="panel admin-summary"><div class="section-title"><h2>行政事务与人力资源</h2>${adminLink('进入事务工具清单 ↗','tab','tools','','primary')}</div><div class="oa-metrics"><div><strong>${rows.filter(r=>r.status==='pending').length}</strong><span>待审批人事事务</span></div><div><strong>${rows.filter(r=>r.status==='approved').length}</strong><span>待行政办理</span></div><div><strong>${assets.filter(r=>r.status==='pending').length}</strong><span>待处理资产申请</span></div><div><strong>${data.admin.assets.filter(a=>a.mode==='借用'&&a.status==='issued'&&a.due<asOf).length}</strong><span>借用逾期资产</span></div></div></section>`}
function administrationView(){if(adminTab==='access'&&!C.adminCan(data,user,'access'))adminTab='tools';return title('ADMINISTRATION','行政事务工具清单','人事申请关联成员档案；资产与权限由获授权的行政人员管理。',button('独立窗口 ↗','new-window','oa'))+`<div class="admin-tabs">${Object.entries(adminLabels).filter(([k])=>k!=='access'||C.adminCan(data,user,'access')).map(([k,name])=>adminLink(name,'tab',k,'',adminTab===k?'primary':'')).join('')}</div>`+(adminTab==='tools'?adminTools():adminTab==='personnel'?personnelPanel():adminTab==='assets'?assetPanel():adminTab==='access'?accessPanel():oaView())}
function adminTools(){const hints={请假:'填写日期、时长与安排，审批后由行政登记。',出差:'出差地点、行程与日期，关联业务项目。',调休:'提交调休时段及依据，审批后登记。',入职:'行政提交入职资料，批准后建立成员档案。',转岗:'办理岗位、汇报关系与关联项目变更。',离职:'核对工作交接、资产归还及待办责任。',工作交接:'明确接收人、交接清单及需移交任务。'};
return adminSummary()+`<section class="panel"><div class="section-title"><h2>日常人事事务</h2>${button('打开人力资源 →','module','hr','','link')}</div><div class="admin-tools">${C.adminCategories.map((name,i)=>`<article class="admin-tool"><span class="admin-number">0${i+1}</span><h3>${name}</h3><p>${hints[name]}</p>${!['入职','转岗'].includes(name)||C.adminCan(data,user,'personnel')?adminLink('发起'+name,'personnel-new',name):'<span class="muted">由人事行政发起</span>'}</article>`).join('')}</div></section><section class="panel"><div class="section-title"><h2>资产与办公资源</h2>${adminLink('设备台账 →','tab','assets','','link')}</div><div class="admin-resource-tools">${['领用','借用','归还','维修','采购'].map(name=>adminLink(name+'申请','asset-request',name)).join('')}</div><p class="muted">登记办公设备，追踪持有人、借还与维修记录。采购只演示审批和台账登记。</p></section><section class="panel"><div class="section-title"><h2>方案与团队协作</h2>${adminLink('打开协作与审批 →','tab','collaboration','','primary')}</div><p class="muted">保留申请审批、会议、汇报、跨部门协作与公告；方案附件按名称和说明展示，支持评论与回复。</p></section>`}
function personnelPanel(compact=false){const rows=adminRows('personnel').filter(r=>view!=='hr'||!moduleProject||r.project===moduleProject);return `<section class="panel"><div class="section-title"><div><h2>人事事务办理</h2><p class="muted">申请 → 指定负责人审批 → 行政办理 → 同步成员档案</p></div>${compact?adminLink('全部人事事务 →','tab','personnel','','link'):''}</div><div class="admin-resource-tools">${C.adminCategories.filter(n=>!['入职','转岗'].includes(n)||C.adminCan(data,user,'personnel')).map(n=>adminLink('＋ '+n,'personnel-new',n)).join('')}</div><div class="table-scroll"><table><thead><tr><th>事务 / 申请标题</th><th>对象 / 关联项目</th><th>日期 / 时长</th><th>审批人 / 状态</th><th>操作</th></tr></thead><tbody>${rows.map(r=>`<tr><td><b>${esc(r.category)}</b><p>${esc(r.title)}</p></td><td>${esc(r.subject?who(r.subject):r.details.name)}<p>${esc(r.project?projectName(r.project):'集团事务')}</p></td><td>${esc(r.start)} → ${esc(r.end)}${r.hours?`<p>${r.hours} 小时</p>`:''}</td><td>${esc(who(r.approver))}<p>${badge(adminState[r.status],r.status==='pending'?'amber':'')}</p></td><td>${adminLink('查看 / 处理','personnel-detail',r.id)}</td></tr>`).join('')}</tbody></table></div>${rows.length?'':empty('暂无人事事务，选择上方工具发起申请')}</section>`}
function adminApprovals(){const rows=adminRows('personnel').filter(r=>r.status==='pending'||r.status==='approved');return `<section class="panel"><div class="section-title"><h2>行政与人事待办</h2>${adminLink('全部事务 →','tab','personnel','','link')}</div>${rows.map(r=>`<div class="oa-todo"><div><b>${esc(r.category+' · '+r.title)}</b><p>${esc(r.subject?who(r.subject):r.details.name)} · ${esc(who(r.approver))} · ${adminState[r.status]}</p></div>${adminLink('查看 / 处理','personnel-detail',r.id)}</div>`).join('')||empty('暂无待处理人事事务')}${adminRows('assetRequests').filter(r=>r.status==='pending').map(r=>`<div class="oa-todo"><b>资产${esc(r.category)} · ${esc(r.title)}</b>${adminLink('查看 / 处理','asset-request-detail',r.id)}</div>`).join('')}</section>`}
function mockAttachmentField(){return `<label class="full">方案 / 资料附件（展示）<textarea name="attachmentNames" rows="2" placeholder="每行一个附件名称，例如：10店试点方案.pdf"></textarea><small class="muted">仅展示附件名称，不上传或下载真实文件。</small></label><label class="full">附件说明<input name="attachmentNote" placeholder="说明附件用途、版本或内容概要"></label>`}
function mockFiles(fd){return String(fd.get('attachmentNames')||'').split(/\r?\n/).map(x=>x.trim()).filter(Boolean).map(name=>({name,note:String(fd.get('attachmentNote')||'')}))}
function attachmentsView(list){return `<div class="attachment-list">${(list||[]).map(f=>`<div class="attachment-item"><b>▧ ${esc(f.name)}</b>${badge('展示附件','gray')}<p>${esc(f.note||'未填写说明')}</p><small>${esc(who(f.person))} · ${esc(f.time)} · 未保存真实文件</small></div>`).join('')||'<p class="muted">暂无附件展示</p>'}</div>`}
function discussionView(k,r){return `<section class="discussion"><h3>方案 / 资料附件</h3>${attachmentsView(r.attachments)}<div class="section-title"><h3>评论与回复 · ${(r.discussion||[]).length}</h3>${adminLink('＋ 发表评论','discuss',r.id,`data-kind="${k}"`)}</div><p class="muted">评论用于讨论和补充，不替代审批意见。</p>${(r.discussion||[]).map(c=>`<div class="discussion-entry ${c.replyTo?'is-reply':''}"><div class="row spread"><b>${esc(who(c.person))}</b><small class="muted">${esc(c.time)}</small></div>${c.replyTo?`<p class="reply-quote">回复 ${esc(who(r.discussion.find(x=>x.id===c.replyTo)?.person))}：${esc(r.discussion.find(x=>x.id===c.replyTo)?.text.slice(0,100))}</p>`:''}<p class="oa-pre">${esc(c.text)}</p>${c.attachments?.length?attachmentsView(c.attachments):''}${adminLink('回复','discuss',r.id,`data-kind="${k}" data-reply="${esc(c.id)}"`,'link')}</div>`).join('')||'<p class="muted">还没有评论，可在这里提出问题或补充方案。</p>'}</section>`}
function discussModal(k,id,reply=''){const r=(data.oa[k]||data.admin[k]).find(r=>r.id===id);showModal(reply?'回复评论':'发表评论',`<p>${esc(r.title)}</p><div class="form-grid">${area('评论内容','text')}${mockAttachmentField()}</div>`,fd=>commit({type:'admin',op:'discuss',values:{kind:k,record:id,replyTo:reply,text:fd.get('text'),files:mockFiles(fd)}}))}
function personnelEdit(category,id){const r=id?data.admin.personnel.find(r=>r.id===id):{},z=r.details||{},can=C.adminCan(data,user,'personnel'),people=data.members.filter(m=>C.adminActive(data,m.id)),subject=r.subject||user.person;
let body=field('申请标题','title',r.title||category+'申请');if(category!=='入职')body+=select('办理对象','subject',can?people:people.filter(m=>m.id===user.person),subject);
body+=select('关联项目（可选）','project',[{id:'',name:'集团事务'},...projectOptions()],r.project||'')+field(category==='入职'?'入职日期':category==='转岗'?'生效日期':'开始日期','start',r.start||asOf,'date')+field('结束 / 办理日期','end',r.end||asOf,'date');
if(['请假','调休','出差'].includes(category))body+=numberField('申请时长（小时）','hours',r.hours||8,0,0.5);
body+=select('审批负责人','approver',people.filter(m=>m.level!=='operator'&&m.id!==user.person),r.approver||people.find(m=>m.id===data.members.find(x=>x.id===user.person)?.reportsTo&&m.id!==user.person)?.id||people.find(m=>m.level!=='operator'&&m.id!==user.person)?.id)+area('原因 / 说明与安排','reason',r.reason);
if(category==='出差')body+=field('出差地点 / 行程','destination',z.destination);
if(['入职','转岗'].includes(category)){if(category==='入职')body+=field('入职成员姓名','name',z.name);body+=field('目标岗位职责','role',z.role)+select('成员层级','level',[{id:'operator',name:'员工'},{id:'manager',name:'管理负责人'}],z.level||'operator')+select('目标汇报对象','reportsTo',people.filter(m=>m.level!=='operator'&&m.id!==subject),z.reportsTo||'ceo')+`<label class="full">目标关联项目<select name="projects" multiple size="4">${projectOptions().map(p=>`<option value="${esc(p.id)}" ${z.projects?.includes(p.id)?'selected':''}>${esc(p.name)}</option>`).join('')}</select></label>`}
if(category==='工作交接')body+=select('交接接收人','receiver',people.filter(m=>m.id!==subject),z.receiver||people.find(m=>m.id!==subject)?.id)+area('工作 / 资料交接清单','items',z.items)+`<label class="full">移交未完成任务（可多选）<select name="tasks" multiple size="5">${handoverTasks().filter(t=>t.owner===subject&&t.status==='active').map(t=>`<option value="${esc(t.id)}" ${z.tasks?.includes(t.id)?'selected':''}>${esc(t.name)}</option>`).join('')}</select><small class="muted">接收人确认后由行政办理；待验收任务需先处理，项目负责人需另行变更。</small></label>`;
body+=mockAttachmentField();showModal((id?'修改并重提':'发起')+' · '+category,`<div class="form-grid">${body}</div><p class="muted">审批通过后仍需行政办理。请假与调休仅登记，不自动计算余额或工资。</p>`,fd=>{const v=Object.fromEntries(fd.entries()),details={};if(category==='出差')details.destination=v.destination;if(['入职','转岗'].includes(category))Object.assign(details,{name:v.name||'',role:v.role,level:v.level,reportsTo:v.reportsTo,projects:fd.getAll('projects')});if(category==='工作交接')Object.assign(details,{receiver:v.receiver,items:v.items,tasks:fd.getAll('tasks')});commit({type:'admin',op:'personnel',id,values:{...v,category,subject:v.subject||'',details,files:mockFiles(fd)}})});
if(category==='工作交接'){const input=$('modalBody').querySelector('[name="subject"]');input.onchange=()=>{const target=$('modalBody').querySelector('[name="tasks"]');target.innerHTML=handoverTasks().filter(t=>t.owner===input.value&&t.status==='active').map(t=>`<option value="${esc(t.id)}">${esc(t.name)}</option>`).join('');const rec=$('modalBody').querySelector('[name="receiver"]');rec.innerHTML=opts(people.filter(m=>m.id!==input.value),people.find(m=>m.id!==input.value)?.id)}}
}
function personnelDetail(id){const r=data.admin.personnel.find(x=>x.id===id);if(!r||!C.adminVisible(data,user,'personnel',r))throw Error('无权查看');let actions='';const act=(label,op)=>adminLink(label,op,id);
if(r.status==='pending'&&r.approver===user.person)actions+=act('审批并填写意见','personnel-decide');if(r.status==='pending'&&r.author===user.person)actions+=act('撤回申请','personnel-withdraw');if(['rejected','withdrawn'].includes(r.status)&&r.author===user.person)actions+=act('修改并重新提交','personnel-edit');if(r.status==='approved'&&C.adminCan(data,user,'personnel'))actions+=act('办理完成','personnel-complete');if(r.category==='工作交接'&&r.status==='approved'&&r.details.receiver===user.person&&!r.handoverAccepted)actions+=act('确认接收交接','handover-accept');
const labels={name:'姓名',role:'目标岗位',level:'层级',reportsTo:'汇报对象',projects:'关联项目',destination:'地点 / 行程',receiver:'接收人',items:'交接清单',tasks:'移交任务'};
showModal(r.category+' · '+r.title,`${badge(adminState[r.status])}<p>办理对象：${esc(r.subject?who(r.subject):r.details.name)} · 审批人：${esc(who(r.approver))}</p><p>${esc(r.start)} → ${esc(r.end)}${r.hours?' · '+r.hours+' 小时':''} · ${esc(r.project?projectName(r.project):'集团事务')}</p><div class="criteria oa-pre">${esc(r.reason)}</div>${Object.entries(r.details).map(([k,v])=>`<p><b>${labels[k]||esc(k)}：</b>${esc(k==='reportsTo'||k==='receiver'?who(v):k==='projects'?v.map(projectName).join('、'):k==='tasks'?v.map(id=>data.tasks.find(t=>t.id===id)?.name||id).join('、'):v)}</p>`).join('')}${r.category==='工作交接'?'<p>接收确认：'+(r.handoverAccepted?'已确认':'尚未确认')+'</p>':''}<div class="actions oa-quick">${actions}</div><h3>办理记录</h3>${oaLog(r.events)}${discussionView('personnel',r)}`,null)}
function assetPanel(){const manage=C.adminCan(data,user,'assets');return `<section class="panel"><div class="section-title"><div><h2>办公设备台账</h2><p class="muted">每件设备一条记录，领用与借还均保留经办记录。</p></div>${manage?adminLink('＋ 登记资产','asset-edit','','','primary'):''}</div><div class="admin-resource-tools">${['领用','借用','归还','维修','采购'].map(n=>adminLink(n+'申请','asset-request',n)).join('')}</div><div class="table-scroll"><table><thead><tr><th>编号 / 资产</th><th>分类 / 位置</th><th>价值</th><th>状态 / 持有人</th><th>操作</th></tr></thead><tbody>${data.admin.assets.map(a=>`<tr><td><b>${esc(a.code)}</b><p>${esc(a.name)}</p></td><td>${esc(a.category)}<p>${esc(a.location)}</p></td><td>${money(a.value,a.currency)}</td><td>${badge(adminState[a.status])}<p>${a.holder?esc(who(a.holder))+' · '+esc(a.mode):'—'}</p>${a.due?`<p class="${a.due<asOf?'red-text':''}">应还 ${esc(a.due)}</p>`:''}</td><td>${adminLink('查看记录','asset-detail',a.id)}${manage?adminLink('编辑','asset-edit',a.id):''}</td></tr>`).join('')}</tbody></table></div>${data.admin.assets.length?'':empty('暂无设备；由资产管理员登记后即可申请领用或借用')}</section><section class="panel"><div class="section-title"><h2>资产申请与办理</h2></div>${adminRows('assetRequests').map(r=>`<div class="oa-todo"><div><b>${esc(r.category+' · '+r.title)}</b><p>${esc(who(r.author))} · ${esc(r.due)} · ${adminState[r.status]}</p></div>${adminLink('查看 / 处理','asset-request-detail',r.id)}</div>`).join('')||empty('暂无资产申请')}</section>`}
function assetEdit(id){const a=data.admin.assets.find(x=>x.id===id)||{};showModal(id?'编辑设备台账':'登记办公设备',`<div class="form-grid">${field('资产编号（唯一）','code',a.code)}${field('设备名称','name',a.name)}${field('分类','category',a.category||'办公设备')}${field('存放位置','location',a.location)}${numberField('登记价值','value',a.value||0,0,0.01)}${select('币种','currency',[{id:'CNY',name:'人民币 CNY'},{id:'USD',name:'美元 USD'}],a.currency||'CNY')}</div>`,fd=>commit({type:'admin',op:'asset',id,values:Object.fromEntries(fd.entries())}))}
function assetRequestEdit(category){const eligible=data.admin.assets.filter(a=>['领用','借用'].includes(category)?a.status==='available':category==='归还'?a.holder===user.person&&a.status==='issued':a.status!=='repair'&&(a.holder===user.person||C.adminCan(data,user,'assets')));if(category!=='采购'&&!eligible.length)return showModal('暂无可'+category+'的资产','<p>请先由资产管理员核对设备状态和当前持有人，再发起申请。</p>',null);
let body=field('申请标题','title',category+'申请')+select('关联项目','project',[{id:'',name:'集团事务'},...projectOptions()],'')+field(category==='借用'?'预计归还日期':'期望办理日期','due',asOf,'date')+area('用途 / 原因与要求','reason');if(category==='采购')body+=field('拟采购设备 / 规格','item')+numberField('预计金额','amount',0,0,0.01)+select('币种','currency',[{id:'CNY',name:'人民币 CNY'},{id:'USD',name:'美元 USD'}],'CNY');else body+=select('选择设备','asset',eligible.map(a=>({id:a.id,name:a.code+' · '+a.name})),eligible[0]?.id);body+=mockAttachmentField();showModal('资产'+category+'申请',`<div class="form-grid">${body}</div>`,fd=>commit({type:'admin',op:'asset-request',values:{...Object.fromEntries(fd.entries()),category,files:mockFiles(fd)}}))}
function assetDetail(id){const a=data.admin.assets.find(x=>x.id===id);showModal(a.code+' · '+a.name,`<p>${esc(a.category)} · ${esc(a.location)} · ${money(a.value,a.currency)}</p><p>${badge(adminState[a.status])} 持有人：${esc(a.holder?who(a.holder):'无')}</p>${a.status==='repair'&&C.adminCan(data,user,'assets')?adminLink('登记维修完成','repair-finish',id):''}<h3>资产记录</h3>${oaLog(a.events)}`,null)}
function assetRequestDetail(id){const r=data.admin.assetRequests.find(x=>x.id===id);if(!C.adminVisible(data,user,'assetRequests',r))throw Error('无权查看');showModal('资产'+r.category+' · '+r.title,`${badge(adminState[r.status])}<p>${esc(who(r.author))} · ${esc(r.due)}</p><div class="criteria oa-pre">${esc(r.reason)}</div><p>${esc(r.category==='采购'?r.item:data.admin.assets.find(a=>a.id===r.asset)?.name)}${r.category==='采购'?' · '+money(r.amount,r.currency):''}</p>${r.status==='pending'&&C.adminCan(data,user,'assets')&&r.author!==user.person?adminLink('审批并登记办理','asset-decide',id):''}<p class="muted">采购通过后登记台账，不触发付款；本人申请须由另一位资产管理员或 CEO 处理。</p><h3>办理记录</h3>${oaLog(r.events)}${discussionView('assetRequests',r)}`,null)}
function accessPanel(){if(!C.adminCan(data,user,'access'))return empty('当前成员没有职位与权限管理权限');return `<section class="panel"><div class="section-title"><h2>行政职位与权限</h2>${adminLink('＋ 建立职位','position-edit','','','primary')}</div><p class="muted">行政权限按职位分配，可独立授予管理负责人或运营成员；不会授予 CEO 战略权限。</p><div class="admin-tools">${data.admin.positions.map(p=>`<article class="admin-tool"><h3>${esc(p.name)}</h3><p>${p.permissions.map(x=>adminPermissionNames[x]).join('、')||'暂无权限'}</p>${adminLink('编辑权限','position-edit',p.id)}</article>`).join('')}</div></section><section class="panel"><div class="section-title"><h2>人员职位分配</h2></div>${data.members.filter(m=>m.id!=='ceo').map(m=>`<div class="oa-todo"><div><b>${esc(m.name)} · ${esc(m.role)}</b><p>${m.employment==='离职'?'已离职':(data.admin.assignments.find(a=>a.member===m.id)?.positions||[]).map(id=>esc(data.admin.positions.find(p=>p.id===id)?.name)).join('、')||'未分配行政职位'}</p></div>${m.employment!=='离职'?adminLink('分配职位','grant',m.id):''}</div>`).join('')}</section>`}

function renderNavigation(pending,risks){

  }).join('')

function dailyWorkView(){const subject=wCurrentSubject(),date=workDate||asOf;const work=data.workTasks.items.filter(t=>t.owner===subject&&!C.workExempt(data,{kind:'work',id:t.id},subject,date)&&(t.workDate===date||t.workDate<date&&!['confirmed','exempt'].includes(t.status)));const plans=data.workTasks.plans.filter(p=>p.member===subject&&p.date===date&&!p.exempt);const daily=work.filter(t=>t.kind==='daily').map(t=>({t,ref:{kind:'work',id:t.id}})),other=work.filter(t=>t.kind==='adhoc').map(t=>({t,ref:{kind:'work',id:t.id}}));for(const cover of data.workTasks.resolutions.filter(r=>r.substitute===subject&&r.status==='accepted')){const t=C.workTask(data,cover.ref);if(t&&!['done','confirmed','exempt'].includes(t.status)&&!other.some(r=>wRef(r.ref)===wRef(cover.ref)))other.push({t,ref:cover.ref})}for(const p of plans){const t=C.workTask(data,p.ref);if(t&&!other.some(r=>wRef(r.ref)===wRef(p.ref)))other.push({t,ref:p.ref})}for(const t of data.tasks.filter(t=>t.owner===subject&&!C.workExempt(data,{kind:'project',id:t.id},subject,date)&&t.status!=='done'&&t.end<=date))if(!other.some(r=>r.ref.id===t.id))other.push({t,ref:{kind:'project',id:t.id}});

function edit(kind,id,parent,parentTask=""){
const x=id?data[kind].find(a=>a.id===id):{},adding=!id;
const choices={projects:"项目战略",stages:"目标 O",milestones:"关键结果 KR",tasks:"行动任务"};
let body="";
if(kind==="projects"){body=field("项目名称","name",x.name)+field("项目简称","code",x.code||"NEW")+select("项目负责人","leader",data.members.filter(p=>p.level==="manager"),x.leader||"lin")+select("优先级","priority",["P0","P1","P2"].map(id=>({id,name:id})),x.priority||"P1")+field("开始日期","start",x.start||asOf,"date")+field("目标日期","end",x.end||asOf,"date")+area("CEO 发展方向与阶段目标","goal",x.goal)+area("项目验收标准","criteria",x.criteria)}
if(kind==="stages"){body=field("目标 O 名称","name",x.name)+area("目标方向 / 预期价值","goal",x.goal)}
if(kind==="milestones"){body=field("关键结果 KR 名称","name",x.name)+field("截止日期","end",x.end||data.projects.find(p=>p.id===data.stages.find(s=>s.id===(x.stage||parent))?.project)?.end||asOf,"date")+area("验收证据与标准","criteria",x.criteria)+select("量化指标","metricEnabled",[{id:"yes",name:"设置可量化KR"},{id:"no",name:"暂未设置指标"}],x.metric?"yes":adding?"yes":"no")+numberField("基线值","baseline",x.metric?.baseline??0)+numberField("目标值","target",x.metric?.target??100)+numberField("当前结果值","current",x.metric?.current??0)+field("指标单位","unit",x.metric?.unit||"%")+numberField("权重","weight",x.metric?.weight??1,0.01);}
if(kind==="tasks"){body=field("任务名称","name",x.name)+select("责任人","owner",data.members.filter(p=>p.id!=="ceo"),x.owner||data.tasks.find(t=>t.id===parentTask)?.owner||"chen")+field("负责角色 / 部门","roleName",x.roleName||"运营规划与推进")+select("优先级","priority",["P0","P1","P2"].map(id=>({id,name:id})),x.priority||"P1")+field("开始日期","start",x.start||data.tasks.find(t=>t.id===parentTask)?.start||asOf,"date")+field("截止日期","end",x.end||data.tasks.find(t=>t.id===parentTask)?.end||data.milestones.find(m=>m.id===parent)?.end||asOf,"date")+area("交付物","delivery",x.delivery)+area("验收标准","criteria",x.criteria)+`<label class="full">前置依赖（按住 Ctrl 或 Command 多选）<select name="deps" multiple size="5">${data.tasks.filter(t=>t.id!==id).map(t=>`<option value="${esc(t.id)}" ${x.deps?.includes(t.id)?"selected":""}>${esc(C.projectOf(data,t).code+" · "+t.name)}</option>`).join("")}</select></label>`}
body+=area("本次新增 / 调整的原因","reason","",false);
showModal((adding?"添加":"编辑")+choices[kind],`<div class="form-grid">${body}</div>`,fd=>{
const values=Object.fromEntries(fd.entries());const reason=values.reason;delete values.reason;
if(kind==="stages")values.project=x.project||parent;
if(kind==="milestones"){values.stage=x.stage||parent;values.metric=fd.get("metricEnabled")==="yes"?{baseline:Number(fd.get("baseline")),target:Number(fd.get("target")),current:Number(fd.get("current")),weight:Number(fd.get("weight")),unit:fd.get("unit")}:null}
if(kind==="tasks"){values.milestone=x.milestone||parent;values.parent=x.parent||parentTask||"";values.deps=fd.getAll("deps")}
commit({type:adding?"add":"edit",kind,id,values,reason});
});
}
